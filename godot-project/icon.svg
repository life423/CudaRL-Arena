<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spiralGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4757;stop-opacity:0.8" />
      <stop offset="30%" style="stop-color:#ff6b47;stop-opacity:0.9" />
      <stop offset="70%" style="stop-color:#5f27cd;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#00d2d3;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="arrowheadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2d3;stop-opacity:1" />
    </linearGradient>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGradient)" stroke="#16213e" stroke-width="2"/>
  
  <!-- Spiral arrow path -->
  <path d="M 48 32 
           A 16 16 0 0 0 32 16
           A 24 24 0 0 0 8 32
           A 32 32 0 0 0 32 56
           A 40 40 0 0 0 56 32
           A 12 12 0 0 0 44 20" 
        stroke="url(#spiralGradient)" 
        stroke-width="4" 
        stroke-linecap="round" 
        fill="none" 
        filter="url(#softGlow)"/>
  
  <!-- Arrow head -->
  <g fill="url(#arrowheadGradient)" filter="url(#softGlow)">
    <polygon points="44,20 52,16 48,24 44,20"/>
  </g>
  
  <!-- Small starting dot (exploration beginning) -->
  <circle cx="48" cy="32" r="2" fill="#ff4757" opacity="0.8"/>
  
  <!-- Subtle learning iterations indicator -->
  <g stroke="#00ff88" stroke-width="1" fill="none" opacity="0.4">
    <circle cx="32" cy="32" r="8">
      <animate attributeName="r" values="8;12;8" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>