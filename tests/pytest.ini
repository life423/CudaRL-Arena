[pytest]
# Pytest configuration for CudaRL-Arena
minversion = 6.0
testpaths = unit integration performance
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=python/cudarl
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-report=term-missing
    --cov-fail-under=80
    --durations=10
    --maxfail=3

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interaction
    gpu: Tests requiring CUDA/GPU functionality
    slow: Slow running tests (>5 seconds)
    performance: Performance benchmark tests
    rtx5070: RTX 5070 specific GPU tests
    memory: Memory usage and allocation tests
    regression: Regression testing for known issues
    smoke: Quick smoke tests for basic functionality
    
# Warning filters
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning:cupy.*
    ignore::FutureWarning:numpy.*

# Timeout for tests (seconds)
timeout = 300
timeout_method = thread

# Parallel execution
norecursedirs = .git .tox dist build *.egg CMakeFiles

# Coverage configuration
[coverage:run]
source = python/cudarl
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */build/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
