name: Foundation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-foundation:
    name: Physics and state, CPU (no CUDA toolkit)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check the qualified flexible-tail Godot package
        run: ./tools/test-flexible-tail-package.ps1
      - name: Check the Windows Godot package before building
        run: ./tools/test-live-package.ps1
      - name: Configure isolated physical foundation
        run: cmake -S . -B build -DCUDARL_ENABLE_CUDA=OFF -DCUDARL_BUILD_GODOT=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build native pond geometry checks
        run: |
          cmake -S tools/pond-geometry-check -B build/pond-geometry
          cmake --build build/pond-geometry --config Release --parallel
      - name: Check shared pond geometry without simulation
        run: ./build/pond-geometry/Release/pond_geometry_check.exe
