name: Foundation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-foundation:
    name: Physics and state, CPU (no CUDA toolkit)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated physical foundation
        run: cmake -S . -B build -DCUDARL_ENABLE_CUDA=OFF -DCUDARL_BUILD_GODOT=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build untimed Swim bookkeeping checks
        run: |
          cmake -S tools/untimed-swim-check -B build/untimed-swim
          cmake --build build/untimed-swim --config Release --parallel
      - name: Check untimed Swim bookkeeping without simulation
        run: ./build/untimed-swim/Release/untimed_swim_bookkeeping_check.exe
